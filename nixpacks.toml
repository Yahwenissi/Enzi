[phases.setup]
nix_packages = [
  "nodejs_22",
  "npm-9_x",
  "openssl",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libxss1",
  "libgtk-3-0",
  "libxshmfence1",
  "libglu1",
  "chromium",
  "libcups2",
  "libgbm1",
  "libasound2t64",
  "libpangocairo-1.0-0"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"